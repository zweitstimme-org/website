      <stop offset="50%" stop-color="#1f6f96" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1f6f96" stop-opacity="0.50"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

