  <title id="title">Beispiel: Kalman-Glättung von Umfragepunkten</title>
  <desc id="desc">Fiktive Umfragepunkte und eine geglättete Kalman-Linie. Das Unsicherheitsband ist eng bei dichter Umfragelage und wird in einer längeren Lücke ohne Umfragen breiter.</desc>

